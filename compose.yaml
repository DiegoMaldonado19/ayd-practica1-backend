name: fitness-app-backend

services:
  postgres:
    image: postgres:17-alpine
    container_name: fitness_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitness_db}
      POSTGRES_USER: ${POSTGRES_USER:-fitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness_dev}
      # The DATE columns that default to CURRENT_DATE -member.joined_on,
      # trainer_assignment.start_date- resolve in the session timezone. Left in UTC
      # they date a 19:00 alta as tomorrow. Read at initdb, so an existing volume
      # keeps whatever postgresql.conf already has: reseed to pick this up.
      TZ: America/Guatemala
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitness} -d ${POSTGRES_DB:-fitness_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: djmaldonado19/fitness-app-backend:latest
    container_name: fitness_backend
    restart: unless-stopped
    working_dir: /app
    # Background loop recompiles whatever changed under src/main; spring-boot-devtools
    # sees the new classes in target/ and restarts the application on its own.
    # ponytail: 2s find poll. Swap for inotifywait only if the poll ever costs more than it saves.
    command: >
      sh -c "touch /tmp/build;
      { while sleep 2; do find src/main -newer /tmp/build -print -quit | grep -q . && { touch /tmp/build; mvn -q compile; }; done; } &
      mvn spring-boot:run"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fitness_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fitness}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fitness_dev}
      # Every LocalDate.now() in the code resolves in the JVM default zone, and the
      # gym runs on GMT-6. Without this the container is UTC and the six hours after
      # 18:00 local already count as tomorrow: a member who logs a meal at 19:00
      # cannot edit it a minute later, because MealService.assertSameDay compares it
      # against a date that already rolled over.
      TZ: America/Guatemala
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-override-in-production-32b}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Empty on purpose: with no SMTP reachable, the verification code is written
      # to this container's log instead of being delivered. Host and port keep the
      # defaults of application.yml.
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - maven_repo:/root/.m2
      # Named volume so container builds never drop root-owned artifacts on the host tree.
      - build_output:/app/target
    healthcheck:
      # Without this, `up --wait` only waits for the container to be running, so a
      # deploy reports success while Spring crash-loops behind restart: unless-stopped.
      # bash explicitly: /bin/sh is dash here and has no /dev/tcp. The port only
      # opens once Tomcat finishes binding, so the connect alone is the signal.
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080" ]
      interval: 10s
      timeout: 5s
      retries: 5
      # First run compiles from scratch before the port ever opens.
      start_period: 180s

volumes:
  postgres_data:
  maven_repo:
  build_output:
