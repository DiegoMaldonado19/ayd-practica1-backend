name: CI/CD Pipeline Backend

on:
  workflow_dispatch:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  DOCKER_USERNAME: djmaldonado19
  DOCKER_IMAGE: fitness-app-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # Tests are skipped: the only test is a @SpringBootTest context load and it
      # needs a live datasource. Drop -DskipTests once tests can run without one.
      - name: Compile and package
        run: mvn -B package -DskipTests

  docker-push:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=${{ github.run_number }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY:     ${{ secrets.EC2_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          REPO_PATH:   ${{ secrets.REPO_PATH }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          # compose.yaml carries a dev default for the DB password so a fresh
          # clone just works. Production must never fall back to it.
          : "${DB_PASSWORD:?the DB_PASSWORD secret is empty; refusing to deploy}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" "
              set -euo pipefail
              cd '$REPO_PATH'
              git pull origin main
              {
                echo 'POSTGRES_DB=fitness_db'
                echo 'POSTGRES_USER=$DB_USER'
                echo 'POSTGRES_PASSWORD=$DB_PASSWORD'
              } > .env
              docker compose pull
              docker compose up -d --remove-orphans --wait
              docker image prune -f
            "
