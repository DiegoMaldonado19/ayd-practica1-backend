name: CI/CD Pipeline Backend

on:
  workflow_dispatch:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  DOCKER_USERNAME: djmaldonado19
  DOCKER_IMAGE: fitness-app-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # Tests run here: they are plain Mockito unit tests with no Spring context
      # and no datasource. The @SpringBootTest context load that forced
      # -DskipTests was removed.
      - name: Compile, test and package
        run: mvn -B package

  docker-push:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=${{ github.run_number }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        # Secret names mirror the keys of .env one to one, so what the pipeline
        # writes on the server and what a developer keeps locally are the same file.
        env:
          SSH_KEY:           ${{ secrets.EC2_SSH_KEY }}
          SERVER_USER:       ${{ secrets.SERVER_USER }}
          SERVER_HOST:       ${{ secrets.SERVER_HOST }}
          REPO_PATH:         ${{ secrets.REPO_PATH }}
          POSTGRES_DB:       ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER:     ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET:        ${{ secrets.JWT_SECRET }}
          # Optional. Empty falls back to http://<host>:5173 and to no mail server,
          # which sends the verification codes to the application log.
          CORS_ORIGINS:      ${{ secrets.CORS_ALLOWED_ORIGINS }}
          MAIL_USERNAME:     ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD:     ${{ secrets.MAIL_PASSWORD }}
        run: |
          # compose.yaml and application.yml carry dev defaults so a fresh clone
          # just works. Production must never fall back to the two that matter.
          : "${POSTGRES_PASSWORD:?the POSTGRES_PASSWORD secret is empty; refusing to deploy}"
          : "${JWT_SECRET:?the JWT_SECRET secret is empty; refusing to deploy}"

          # HS256 rejects a key under 32 bytes, and it does it at startup: without
          # this check the deploy reports success and the API answers 500 on login.
          [ ${#JWT_SECRET} -ge 32 ] \
            || { echo "JWT_SECRET is ${#JWT_SECRET} characters; it needs at least 32"; exit 1; }

          # The database name and user are not secrets, only overrides.
          POSTGRES_DB="${POSTGRES_DB:-fitness_db}"
          POSTGRES_USER="${POSTGRES_USER:-fitness}"

          # The SPA is published on 5173 of the same host unless a secret says otherwise.
          CORS_ALLOWED_ORIGINS="${CORS_ORIGINS:-http://$SERVER_HOST:5173}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" "
              set -euo pipefail
              cd '$REPO_PATH'
              git pull origin main
              {
                echo 'POSTGRES_DB=$POSTGRES_DB'
                echo 'POSTGRES_USER=$POSTGRES_USER'
                echo 'POSTGRES_PASSWORD=$POSTGRES_PASSWORD'
                echo 'JWT_SECRET=$JWT_SECRET'
                echo 'CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS'
                echo 'MAIL_USERNAME=$MAIL_USERNAME'
                echo 'MAIL_PASSWORD=$MAIL_PASSWORD'
              } > .env
              docker compose pull
              docker compose up -d --remove-orphans --wait
              docker image prune -f
            "
