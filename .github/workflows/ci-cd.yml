name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: fitness-app-backend
  DOCKER_USERNAME: djmaldonado19

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.run_number }} .
          echo "Built Docker image for branch: ${{ github.ref_name }}"

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.DOCKER_IMAGE }}:${{ github.run_number }} ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.run_number }}
          docker tag ${{ env.DOCKER_IMAGE }}:${{ github.run_number }} ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.run_number }}
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest
          echo "Pushed images to Docker Hub"

      - name: Deploy to server
        if: github.ref == 'refs/heads/main'
        env:
          SSH_KEY:     ${{ secrets.EC2_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          REPO_PATH:   ${{ secrets.REPO_PATH }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          VERSION:     ${{ github.run_number }}
        run: |
          # compose.yaml carries a dev default for the DB password so a fresh
          # clone just works. Production must never fall back to it.
          : "${DB_PASSWORD:?the DB_PASSWORD secret is empty; refusing to deploy}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "
            set -euo pipefail
            cd '$REPO_PATH'
            git pull origin main

            {
              echo 'POSTGRES_DB=fitness_db'
              echo 'POSTGRES_USER=$DB_USER'
              echo 'POSTGRES_PASSWORD=$DB_PASSWORD'
              echo 'VERSION=$VERSION'
            } > .env

            docker compose --profile prod pull
            docker compose --profile prod up -d --wait
          "
          echo "Deployment completed"

      - name: Cleanup
        if: always()
        run: |
          docker system prune -f || true